<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1076 325" font-family="'Arial Black', Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <!-- Wordmark: SOLVIC + [target icon in place of O] + SOFT -->
  <text x="28" y="212" font-size="130" font-weight="900" letter-spacing="-1"
        textLength="467" lengthAdjust="spacingAndGlyphs" fill="#135825"
        stroke="#135825" stroke-width="3.5" paint-order="stroke fill">SOLVIC</text>

  <!-- Icon replacing the "O" between SOLVIC and SOFT -->
  <g>
    <circle cx="591" cy="166" r="71" fill="#0EA99E"/>
    <circle cx="591" cy="166" r="50" fill="#FFFFFF"/>
    <rect x="520" y="156" width="142" height="20" fill="#FFFFFF" transform="rotate(-26 591 166)"/>
    <circle cx="591" cy="166" r="26" fill="#F0A93B"/>
  </g>

  <text x="678" y="212" font-size="130" font-weight="900" letter-spacing="-1"
        textLength="325" lengthAdjust="spacingAndGlyphs" fill="#135825"
        stroke="#135825" stroke-width="3.5" paint-order="stroke fill">SOFT</text>

  <!-- Tagline: 40% of main text size, tight beneath it, tighter letter-spacing -->
  <text x="1003" y="284" font-size="52" font-style="italic" font-weight="300" letter-spacing="-0.5"
        text-anchor="end" fill="#4B5563" font-family="'Helvetica Neue', Arial, sans-serif"
        transform="translate(1003,284) skewX(-8) translate(-1003,-284)">A Solution-Based Product Company</text>
</svg>
